<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia da Cena</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial;color:#fff}#stage{position:absolute;inset:0;background:#05090f}.el{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}.el img,.el video{width:100%;height:100%;object-fit:cover}</style></head><body><div id="stage"></div><script>const s=JSON.parse(localStorage.getItem('vd48_scene')||'{"elements":[]}'),stage=document.getElementById('stage');stage.innerHTML=(s.elements||[]).map(e=>`<div class="el" style="left:${e.x}%;top:${e.y}%;width:${e.w}%;height:${e.h}%;font-size:${e.size||36}px;color:${e.color||'#fff'}">${e.type==='text'?e.content:e.type==='image'?`<img src="${e.content}">`:e.type==='video'?`<video src="${e.content}" autoplay muted loop></video>`:e.type==='qrcode'?`▦<br>${e.content}`:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>`).join('');setInterval(()=>{document.querySelectorAll('.clock').forEach(x=>x.textContent=new Date().toLocaleTimeString('pt-BR'))},1000)</script></body></html>
