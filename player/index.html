<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="application-name" content="Vitrine Digital Player">
<meta name="msapplication-tap-highlight" content="no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitrine Digital">
<link rel="manifest" href="../manifest.webmanifest">
<title>Vitrine Digital — Player</title>
<link rel="stylesheet" href="../css/player.css?v=5.0.4-TF1">
</head>
<body>
<div id="playerRoot" class="player-root">
  <main id="stage" class="stage" aria-label="Player Vitrine Digital"></main>
  <div id="status" class="status">Conectando…</div>
  <div id="controls" class="controls">
    <button id="startBtn" type="button">Iniciar reprodução</button>
    <button id="fullscreenBtn" type="button">Tela cheia</button>
  </div>
  <div id="empty" class="empty" hidden>
    <div class="empty-card">
      <strong>Vitrine Digital</strong>
      <span id="emptyMessage">Aguardando conteúdo…</span>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/player.js?v=4.35.0-tizen-local-stable"></script>
</body>
</html>
