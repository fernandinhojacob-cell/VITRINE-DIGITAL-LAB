<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000"><title>Vitrine Edge 5.2</title><style>*{box-sizing:border-box}html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{position:fixed;inset:0;font-family:Arial,sans-serif;color:#fff}#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#stage img,#stage video{width:100%;height:100%;object-fit:cover;background:#000}#stage iframe{width:100%;height:100%;border:0;background:#000}.text{font-size:5vw;text-align:center;padding:6vw}.badge{position:fixed;z-index:5;left:10px;bottom:10px;padding:6px 9px;border-radius:8px;background:#000b;font-size:11px;opacity:.75}.badge.ok{color:#8cffad}.badge.off{color:#ffd27a}.badge.err{color:#ff9a9a}</style></head><body><div id="stage"></div><div id="badge" class="badge">EDGE 5.2 • iniciando</div><script src="../js/config.js"></script><script>
(function(){'use strict';
const VERSION='5.2.0', qp=new URLSearchParams(location.search), code=qp.get('code')||'TV-0001', stage=document.getElementById('stage'),badge=document.getElementById('badge'),cfg=window.SUPABASE_CONFIG||{}, SNAP='vd_edge_snapshot_'+code,CACHE='vd-edge-media-v52';let snap=null,seq=[],idx=0,timer=null,currentUrl='',lastSync=0;
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setBadge(s,c){badge.textContent=s;badge.className='badge '+(c||'')}
function headers(){return {'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json','Prefer':'return=minimal'}}
async function rest(path,opt={}){if(!cfg.url||!cfg.key)throw Error('config Supabase ausente');const r=await fetch(cfg.url+'/rest/v1/'+path,{...opt,headers:{...headers(),...(opt.headers||{})}});if(!r.ok)throw Error('HTTP '+r.status+' '+await r.text());if(r.status===204)return null;return r.json()}
function dayToken(d){return ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'][d.getDay()]}
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function matchSchedule(sc,screen,now){if(sc.active===false)return false;if(sc.screen_id!==screen.id&&(!screen.group_id||sc.group_id!==screen.group_id))return false;const iso=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'),tm=hhmm(now);if(sc.start_date&&iso<sc.start_date)return false;if(sc.end_date&&iso>sc.end_date)return false;const st=String(sc.start_time||'').slice(0,5),et=String(sc.end_time||'').slice(0,5);if(st&&et&&st<=et&&(tm<st||tm>et))return false;if(st&&et&&st>et&&(tm>et&&tm<st))return false;const days=String(sc.days||'').split(',').map(x=>x.trim()).filter(Boolean);return !days.length||days.includes(dayToken(now))}
function buildSeq(s){const now=new Date(),screen=s.screen,schedules=(s.schedules||[]).filter(x=>matchSchedule(x,screen,now)).sort((a,b)=>Number(b.screen_id===screen.id)-Number(a.screen_id===screen.id)),pid=schedules[0]?.playlist_id||screen.playlist_id,items=(s.items||[]).filter(x=>x.playlist_id===pid).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));return items.map(it=>{const m=(s.media||[]).find(x=>x.id===it.media_id);return m?{...m,_playlist:pid,_duration:it.duration||m.duration}:null}).filter(Boolean)}
async function sync(){try{const screens=await rest('screens?code=eq.'+encodeURIComponent(code)+'&select=*');if(!screens[0])throw Error('Tela '+code+' não encontrada');const screen=screens[0];const [schedules,items,media]=await Promise.all([rest('schedules?active=eq.true&select=*'),rest('playlist_items?select=*'),rest('media?active=eq.true&select=*')]);snap={screen,schedules,items,media,synced_at:new Date().toISOString()};localStorage.setItem(SNAP,JSON.stringify(snap));lastSync=Date.now();seq=buildSeq(snap);setBadge('EDGE 5.2 • ONLINE • '+seq.length+' itens','ok');prefetch(seq);return true}catch(e){console.warn('sync',e);if(!snap){try{snap=JSON.parse(localStorage.getItem(SNAP)||'null')}catch(_){}}if(snap){seq=buildSeq(snap);setBadge('EDGE 5.2 • OFFLINE • cache local','off');return false}setBadge('EDGE 5.2 • sem dados locais','err');stage.innerHTML='<div class="text">Sem conexão e sem programação armazenada.</div>';return false}}
async function prefetch(list){if(!('caches'in window))return;const c=await caches.open(CACHE);for(const m of list){const u=m.file_url;if(!u||!/^https?:/i.test(u)||m.type==='web')continue;try{if(await c.match(u))continue;const r=await fetch(u,{cache:'no-store'});if(r.ok||r.type==='opaque')await c.put(u,r.clone())}catch(e){console.warn('cache',m.name,e)}}}
async function playableUrl(m){const u=m.file_url||'';if(!u)return'';if(!('caches'in window)||!/^https?:/i.test(u))return u;try{const c=await caches.open(CACHE),r=await c.match(u);if(r){const b=await r.blob();currentUrl=URL.createObjectURL(b);return currentUrl}}catch(e){}return u}
function clear(){if(timer)clearTimeout(timer);timer=null;if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=''}stage.innerHTML=''}
async function pop(m,status='played',started=Date.now()){if(!navigator.onLine||!snap?.screen?.id)return;try{await rest('proof_of_play',{method:'POST',body:JSON.stringify({screen_id:snap.screen.id,media_id:m.id,playlist_id:m._playlist,started_at:new Date(started).toISOString(),ended_at:new Date().toISOString(),duration_seconds:Math.max(0,Math.round((Date.now()-started)/1000)),status})})}catch(e){}}
async function show(){clear();if(!seq.length){stage.innerHTML='<div class="text">Playlist vazia</div>';timer=setTimeout(()=>{if(snap){seq=buildSeq(snap)}show()},15000);return}const m=seq[idx++%seq.length],started=Date.now(),dur=Math.max(2,Number(m._duration||m.duration||10));try{const src=await playableUrl(m);if(m.type==='video'){const v=document.createElement('video');v.src=src;v.autoplay=true;v.muted=true;v.playsInline=true;v.preload='auto';stage.appendChild(v);let done=false;const next=async(st='played')=>{if(done)return;done=true;await pop(m,st,started);show()};v.onended=()=>next('played');v.onerror=()=>next('error-skipped');try{await v.play()}catch(e){setTimeout(()=>next('error-skipped'),2500)}timer=setTimeout(()=>next('timeout-skipped'),(dur+8)*1000)}else if(m.type==='image'){const im=new Image();im.src=src;im.onload=()=>{};im.onerror=()=>{pop(m,'error-skipped',started);show()};stage.appendChild(im);timer=setTimeout(async()=>{await pop(m,'played',started);show()},dur*1000)}else if(m.type==='web'){if(!navigator.onLine){timer=setTimeout(()=>show(),1000);return}const f=document.createElement('iframe');f.src=src;stage.appendChild(f);timer=setTimeout(async()=>{await pop(m,'played',started);show()},dur*1000)}else{stage.innerHTML='<div class="text">'+esc(m.text_content||m.name)+'</div>';timer=setTimeout(async()=>{await pop(m,'played',started);show()},dur*1000)}}catch(e){console.error(e);setBadge('EDGE 5.2 • erro de mídia • pulando','err');timer=setTimeout(show,1500)}}
async function heartbeat(){if(!snap?.screen?.id||!navigator.onLine)return;const now=new Date().toISOString();try{await rest('screen_heartbeat',{method:'POST',body:JSON.stringify({screen_id:snap.screen.id,last_ping:now,player_version:VERSION})});await rest('screens?id=eq.'+snap.screen.id,{method:'PATCH',body:JSON.stringify({status:'online',ultima_conexao:now,player_version:VERSION,last_error:null})})}catch(e){}}
window.addEventListener('online',()=>{sync().then(()=>heartbeat())});window.addEventListener('offline',()=>setBadge('EDGE 5.2 • OFFLINE • cache local','off'));
(async()=>{await sync();heartbeat();show();setInterval(heartbeat,60000);setInterval(async()=>{const before=JSON.stringify(seq.map(x=>x.id));await sync();const after=JSON.stringify(seq.map(x=>x.id));if(before!==after){idx=0;show()}},60000)})();
})();</script></body></html>
