<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vitrine Digital — Samsung Fullscreen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}body{position:fixed;inset:0}#frame{position:fixed;inset:0;width:100vw;height:100vh;border:0;margin:0;padding:0;background:#000;display:block}.gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:8vw}.gate.hidden{display:none}.card{max-width:720px}.card h1{font-size:clamp(28px,5vw,56px);margin:0 0 18px}.card p{font-size:clamp(18px,2.4vw,28px);line-height:1.4;opacity:.82;margin:0}.hint{margin-top:24px!important;font-weight:700;opacity:1!important}body.fullscreen .gate{display:none}
</style>
</head>
<body>
<iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="gate" class="gate">
  <div class="card">
    <h1>Vitrine Digital</h1>
    <p>Modo Samsung The Frame preparado para tela vertical.</p>
    <p class="hint">Pressione OK no controle para entrar em tela cheia.</p>
  </div>
</div>
<script>
(function(){
  'use strict';
  var q=new URLSearchParams(location.search);
  var code=q.get('code')||'TV-0001';
  var orientation=q.get('orientation')||'portrait';
  var v=q.get('v')||'501';
  var src='index.html?code='+encodeURIComponent(code)+'&tv=1&orientation='+encodeURIComponent(orientation)+'&v='+encodeURIComponent(v);
  document.getElementById('frame').src=src;
  var gate=document.getElementById('gate');
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
  function sync(){document.body.classList.toggle('fullscreen',isFs());gate.classList.toggle('hidden',isFs());}
  function enter(){
    var el=document.documentElement;
    var fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(fn){try{var r=fn.call(el);if(r&&r.catch)r.catch(function(){});}catch(e){}}
    setTimeout(sync,150);
  }
  document.addEventListener('fullscreenchange',sync);
  document.addEventListener('webkitfullscreenchange',sync);
  document.addEventListener('click',enter,{passive:true});
  document.addEventListener('touchend',enter,{passive:true});
  document.addEventListener('keydown',function(e){
    var k=e.key||e.keyCode;
    if(!isFs()&&(k==='Enter'||k==='OK'||k===13||k===29443)){e.preventDefault();enter();}
  });
  window.addEventListener('focus',function(){if(!isFs())gate.classList.remove('hidden');});
  sync();
})();
</script>
</body>
</html>
