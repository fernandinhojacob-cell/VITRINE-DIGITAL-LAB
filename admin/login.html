<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Vitrine Digital PRO</title><link rel="stylesheet" href="../css/admin.css"><style>body{display:grid;place-items:center;min-height:100vh}.login{width:min(420px,92vw)}.login input{width:100%;margin:7px 0 14px}.err{color:#ff8c8c}</style></head><body><div class="card login"><h1>Vitrine Digital PRO</h1><p class="muted">Acesso administrativo</p><form id="login"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button class="btn" type="submit">Entrar</button><p id="msg" class="err"></p></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script>const c=window.SUPABASE_CONFIG||{},m=document.getElementById('msg');if(!c.url||!c.key){m.textContent='Supabase ainda não configurado.'}else{const db=supabase.createClient(c.url,c.key);db.auth.getSession().then(({data})=>{if(data.session)location.href='index.html'});document.getElementById('login').onsubmit=async e=>{e.preventDefault();m.textContent='Entrando…';const f=new FormData(e.target),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)m.textContent=error.message;else location.href='index.html'}};</script></body></html>
